<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Inventory Management</h1>

    <!-- Add Inventory Item Form -->
    <div id="add-item-form" style="display: none;">
        <form action="/api/inventory" method="POST">
            <h2>Add Inventory Item</h2>
            <label for="item_name">Item Name:</label>
            <input type="text" id="item_name" name="item_name" required><br>

            <label for="item_type">Item Type:</label>
            <input type="text" id="item_type" name="item_type" required><br>

            <label for="item_category">Item Category:</label>
            <input type="text" id="item_category" name="item_category" required><br>

            <label for="qty_purchased">Quantity Purchased:</label>
            <input type="number" id="qty_purchased" name="qty_purchased" required><br>

            <label for="reorder_level">Reorder Level:</label>
            <input type="number" id="reorder_level" name="reorder_level" required><br>

            <button type="submit">Add Item</button>
        </form>
    </div>

    <!-- Update Inventory Item Form -->
    <form action="/api/inventory/update" method="POST">
        <h2>Update Inventory Item</h2>
        <label for="item_id">Item ID:</label>
        <input type="text" id="item_id" name="item_id" required><br>

        <label for="item_name">Item Name:</label>
        <input type="text" id="item_name" name="item_name"><br>

        <label for="item_type">Item Type:</label>
        <input type="text" id="item_type" name="item_type"><br>

        <label for="item_category">Item Category:</label>
        <input type="text" id="item_category" name="item_category"><br>

        <label for="qty_purchased">Quantity Purchased:</label>
        <input type="number" id="qty_purchased" name="qty_purchased"><br>

        <label for="reorder_level">Reorder Level:</label>
        <input type="number" id="reorder_level" name="reorder_level"><br>

        <button type="submit">Update Item</button>
    </form>

    <!-- Delete Inventory Item Form -->
    <form action="/api/inventory/delete" method="POST">
        <h2>Delete Inventory Item</h2>
        <label for="item_id">Item ID:</label>
        <input type="text" id="item_id" name="item_id" required><br>

        <button type="submit">Delete Item</button>
    </form>
</body>
</html>
